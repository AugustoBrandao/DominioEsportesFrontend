version: "3.9"

services:
  frontend:
    container_name: dominio-esportes-frontend
    build: ./frontend
    ports:
      - "5173:5173"
    env_file:
      - ./frontend/.env
    volumes:
      - frontend-volume:/var/www/html
    networks:
      - dominio-esportes-networking

  nginx:
    container_name: dominio-esportes-nginx
    build: ./nginx
    ports:
      - "80:80"
    depends_on:
      - frontend
    volumes:
      - frontend-volume:/var/www/html
    networks:
      - dominio-esportes-networking

volumes:
  frontend-volume:

networks:
  dominio-esportes-networking:
    external: true
